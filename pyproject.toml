[project]
name = "hw02-kafka-streaming"
version = "0.1.0"
description = "HW02: Event-Driven Streaming Fraud Detection with Apache Kafka"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "catboost>=1.2.10",
    "numpy>=1.26.0",
    "pandas>=3.0.3",
    "pyarrow>=15.0.0",
    "pydantic>=2.13.4",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "scikit-learn>=1.9.1",
]
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
